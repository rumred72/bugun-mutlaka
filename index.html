<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bugün Mutlaka</title>
<meta name="description" content="Günlük yapılacaklar: bugün mutlaka, bu hafta, bir gün; sabitlenen görevler ve sabah planı.">
<meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bugün Mutlaka">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<script src="vendor/Sortable.min.js"></script>
<style>
:root{
  --bg:#FAF9F5; --surface:#FFFFFF; --surface-2:#F0EEE6; --ink:#141413; --muted:#6B6A64; --line:#E3E0D5;
  --today:#B8452F; --week:#BF8B2E; --someday:#9C9A91; --lock:var(--accent-l,#D97757); --lock-soft:color-mix(in srgb,var(--lock) 13%,var(--bg)); --ok:#5F8D63; --warn:#B8652F;
  --shadow:0 1px 2px rgba(60,45,30,.05),0 3px 10px rgba(60,45,30,.05);
  --display:"Source Serif 4","Tiempos Headline",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#262624; --surface:#30302E; --surface-2:#3A3A37; --ink:#F5F4EE; --muted:#A6A49B; --line:#45443F;
    --today:#E07A62; --week:#D9A955; --someday:#8F8D85; --lock:var(--accent-d,#E08A6A); --lock-soft:color-mix(in srgb,var(--lock) 16%,var(--bg)); --ok:#86B58A; --warn:#E39A62;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.18);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#262624; --surface:#30302E; --surface-2:#3A3A37; --ink:#F5F4EE; --muted:#A6A49B; --line:#45443F;
  --today:#E07A62; --week:#D9A955; --someday:#8F8D85; --lock:var(--accent-d,#E08A6A); --lock-soft:color-mix(in srgb,var(--lock) 16%,var(--bg)); --ok:#86B58A; --warn:#E39A62;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:calc(15px * var(--fs,1));line-height:1.45;padding-inline:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lock);outline-offset:2px}
svg{width:18px;height:18px;flex:none}
.app{max-width:640px;margin:0 auto;padding-block:8px 80px}
.app.wide{max-width:1240px}
.no-est .est-ui{display:none!important}
/* groups */
.ghead{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 4px 2px;font-size:calc(12px * var(--fs,1));letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted);user-select:none}
.ghead:first-child{padding-top:2px}
.ghead .gt{border:0;background:none;padding:2px 0;display:flex;align-items:center;gap:7px;color:inherit;font:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.ghead .gt i{width:9px;height:9px;border-radius:3px;display:inline-block}
.ghead .gc{font-weight:600;opacity:.8}
.ghead .gadd{margin-left:auto;border:0;background:none;color:var(--muted);width:28px;height:24px;border-radius:6px;display:grid;place-items:center;padding:0}
.ghead .gadd:hover{background:var(--surface-2);color:var(--ink)}
.ghead .gadd svg{width:15px;height:15px}
.gchip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:1px 7px;background:var(--surface-2);font-size:calc(12px * var(--fs,1))}
.gchip i{width:8px;height:8px;border-radius:2px;display:inline-block}
.grow{display:flex;align-items:center;gap:8px}
.grow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--ink)}
.grow .sw{width:26px;height:26px;border-radius:7px;border:0;flex:none;padding:0}
.grow .icon-btn{width:30px;height:30px}

/* report */
.report{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.rep-controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.rep-nav{display:flex;align-items:center;gap:4px}
.rep-nav button{border:1px solid var(--line);background:var(--bg);border-radius:8px;width:34px;height:34px;font-size:18px;color:var(--ink)}
.rep-nav span{min-width:0;font-weight:600;font-size:calc(14px * var(--fs,1));padding-inline:6px;text-align:center}
.rep-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:10px;flex-wrap:wrap}
.rep-head h2{margin:2px 0 0;font-family:var(--display);font-size:calc(24px * var(--fs,1));line-height:1.15}
.rep-who{text-align:right;font-size:calc(12.5px * var(--fs,1));color:var(--muted)}
.rep-who b{color:var(--ink);font-size:calc(15px * var(--fs,1))}
.rep-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rep-stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.rep-stat .v{font-family:var(--display);font-size:calc(26px * var(--fs,1));font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.rep-stat .l{font-size:calc(12px * var(--fs,1));color:var(--muted)}
.rep-stat.ok .v{color:var(--ok)} .rep-stat.mid .v{color:var(--week)} .rep-stat.no .v{color:var(--today)}
.rep-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:92px}
.rep-bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;font-size:calc(11.5px * var(--fs,1));color:var(--muted);font-variant-numeric:tabular-nums}
.rep-bars i{display:block;width:100%;max-width:38px;background:var(--ok);border-radius:5px 5px 2px 2px;min-height:2px}
.rep-bars .n{color:var(--ink);font-weight:600}
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px}
.rep-sec h3{margin:0 0 6px;font-size:calc(13px * var(--fs,1));letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.rep-sec h3 .c{color:var(--muted);font-weight:600}
.rep-sec ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.rep-sec li{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;font-size:calc(14px * var(--fs,1));line-height:1.35}
.rep-sec li .r{margin-left:auto;color:var(--muted);font-size:calc(12.5px * var(--fs,1));font-variant-numeric:tabular-nums;white-space:nowrap}
.rep-sec .none{color:var(--muted);font-size:calc(13.5px * var(--fs,1))}
.rep-sec.ok h3{color:var(--ok)} .rep-sec.mid h3{color:var(--week)} .rep-sec.no h3{color:var(--today)}
.rep-proj{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;align-items:center;font-size:calc(14px * var(--fs,1))}
.rep-proj .pbar{height:7px}
.rep-proj .r{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.up{color:var(--ok)} .down{color:var(--today)}
.rep-note textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;color:var(--ink);resize:vertical}
.rep-note p{margin:0;white-space:pre-wrap}
.rep-actions{display:flex;gap:8px;flex-wrap:wrap}
.print-only{display:none}
.hist-title{margin:10px 0 0;font-family:var(--display);font-size:calc(20px * var(--fs,1))}
@media (max-width:620px){ .rep-grid{grid-template-columns:1fr} .rep-stats{grid-template-columns:repeat(2,1fr)} }
@media print{
  @page{margin:14mm}
  html,body{background:#fff!important;padding:0!important}
  body{padding:0!important}
  .top,#banner,.toast,#review,dialog,#view-today,#view-projects,#view-recurring,#view-history>:not(#reportCard){display:none!important}
  .app{max-width:none;padding:0}
  .view{padding:0}
  #reportCard{box-shadow:none;padding:0;color:#111;background:#fff}
  .no-print{display:none!important}
  .print-only{display:block}
  .rep-stat,.rep-note textarea{background:#f4f3ef!important}
}
/* projects */
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.board{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;align-items:flex-start;-webkit-overflow-scrolling:touch}
.pcol{flex:0 0 min(320px,86vw);scroll-snap-align:start;background:var(--surface);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.pcol .task{box-shadow:none;background:var(--bg)}
.pcol .task.pinned{background:color-mix(in srgb,var(--lock) 11%,var(--bg))}
.phead{display:flex;align-items:center;gap:8px}
.phead h2{margin:0;font-family:var(--display);font-size:calc(18px * var(--fs,1));font-weight:700;flex:1;min-width:0;overflow-wrap:anywhere}
.phead .pct{font-size:calc(13px * var(--fs,1));font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.pbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:3px}
.pmeta{font-size:calc(12.5px * var(--fs,1));color:var(--muted);margin-top:-4px}
.pdone-btn{border:0;background:none;color:var(--muted);font-size:calc(13.5px * var(--fs,1));text-align:left;padding:4px 2px;display:flex;align-items:center;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:1px 7px;background:var(--surface-2);font-size:calc(12px * var(--fs,1))}
.pchip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.plist{min-height:8px}
.archive{display:flex;flex-direction:column;gap:6px}
.archive button{display:flex;align-items:center;gap:8px;border:0;background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;box-shadow:var(--shadow)}
.send{display:flex;flex-direction:column;gap:8px;background:var(--bg);border-radius:12px;padding:12px}
.send select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;color:var(--ink)}


.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0;margin-inline:-16px;padding-inline:16px}
.datebar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{margin:0;font-size:calc(12px * var(--fs,1));letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:2px 0 0;font-family:var(--display);font-size:calc(32px * var(--fs,1));line-height:1.1;font-weight:600;letter-spacing:-.01em}
.top-actions{display:flex;align-items:center;gap:6px}
.sync{border:0;background:none;padding:6px 4px;border-radius:8px;font-size:calc(12px * var(--fs,1));color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--someday)}
.sync[data-s="ok"]::before{background:var(--ok)}
.sync[data-s="syncing"]::before{background:var(--week)}
.sync[data-s="needauth"]{color:var(--lock);font-weight:600}
.sync[data-s="needauth"]::before{background:var(--lock)}
.sync[data-s="error"]::before{background:var(--today)}
.sync[data-s="offline"]::before{background:var(--someday)}
.drive input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:calc(14px * var(--fs,1));color:var(--ink);width:100%}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.view{display:flex;flex-direction:column;gap:var(--sec-gap,22px);padding-top:16px}
.summary{margin:0;color:var(--muted);font-size:calc(14px * var(--fs,1));font-variant-numeric:tabular-nums}
.summary b{color:var(--ink);font-weight:600}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:calc(14px * var(--fs,1))}

/* pinned */
.task.pinned{background:color-mix(in srgb,var(--lock) 9%,var(--surface))}
.pin-mark{color:var(--lock);display:inline-flex;vertical-align:-2px;margin-right:5px}
.pin-mark svg{width:15px;height:15px}
.btn.pinb{color:var(--lock);border-color:color-mix(in srgb,var(--lock) 50%,transparent)}

/* sections */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-head{display:flex;align-items:center;gap:8px}
.sec-head h2{margin:0;font-family:var(--display);font-size:calc(18px * var(--fs,1));font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
[data-sec="today"] .dot,.dot.today{background:var(--today)}
[data-sec="week"] .dot,.dot.week{background:var(--week)}
[data-sec="someday"] .dot,.dot.someday{background:var(--someday)}
.count{font-size:calc(13px * var(--fs,1));color:var(--muted);font-variant-numeric:tabular-nums}
.count.over{color:var(--today);font-weight:600}
.sec-head .spacer{flex:1}
.collapse{border:0;background:none;color:var(--muted);font-size:calc(13px * var(--fs,1));padding:4px 6px;border-radius:6px}
.collapse:hover{background:var(--surface-2)}

.tasks,.done-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--row-gap,6px)}
.tasks{min-height:6px}
.task{background:var(--surface);border-radius:12px;display:flex;align-items:flex-start;gap:8px;padding:var(--row-pad,10px) 6px var(--row-pad,10px) 4px;box-shadow:var(--shadow)}
.grip{color:var(--muted);opacity:.55;padding:3px 0 0 2px;cursor:grab;touch-action:none;display:grid}
.grip:hover{opacity:1}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;margin-top:1px;display:grid;place-items:center;padding:0;color:#fff}
.check:hover{border-color:var(--ok)}
.check svg{width:14px;height:14px;opacity:0}
.done .check,.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.done .check svg,.check[aria-pressed="true"] svg{opacity:1}
.lcard .check{width:26px;height:26px;border-color:var(--lock)}
.task-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;border:0;background:none;text-align:left;padding:0}
.title{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:calc(12.5px * var(--fs,1));color:var(--muted);align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.chip svg{width:12px;height:12px}
.chip.warn{background:color-mix(in srgb,var(--today) 16%,transparent);color:var(--today);font-weight:600}
.note{font-size:calc(13px * var(--fs,1));color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.subs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.subs li{display:flex;align-items:flex-start;gap:8px;font-size:calc(14px * var(--fs,1))}
.subcheck{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);background:transparent;padding:0;display:grid;place-items:center;color:#fff;flex:none;margin-top:2px}
.subcheck:hover{border-color:var(--ok)}
.subcheck svg{width:11px;height:11px;opacity:0}
.subcheck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.subcheck[aria-pressed="true"] svg{opacity:1}
.bar{display:block;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;width:min(220px,100%);margin-top:3px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.chip.prog{color:var(--ok);font-weight:600;background:color-mix(in srgb,var(--ok) 14%,transparent)}
.rv-good{font-size:calc(12.5px * var(--fs,1));color:var(--ok);font-weight:600}
.progress-field{display:flex;align-items:center;gap:12px}
.progress-field input[type=range]{flex:1;accent-color:var(--lock);padding:0;background:none;border:0}
.progress-field output{font-family:var(--display);font-size:calc(22px * var(--fs,1));font-weight:600;min-width:3.2ch;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.backup{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.backup h4{margin:0;font-size:calc(15px * var(--fs,1))}
.backup p{margin:0;font-size:calc(13px * var(--fs,1));color:var(--muted)}
.sdone{text-decoration:line-through;color:var(--muted)}
.sub-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sub-list li{display:flex;align-items:center;gap:8px}
.sub-list input,.sub-add input{flex:1;min-width:0}
.sub-add{display:flex;gap:6px}
.done-list .task{box-shadow:none;background:transparent;padding-block:4px}
.done-list .title{text-decoration:line-through;color:var(--muted)}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 8px 24px rgba(0,0,0,.18)}
.empty{font-size:calc(13.5px * var(--fs,1));color:var(--muted);padding:6px 4px;margin:0}

.add{display:flex;gap:6px}
.add input,.rv-add input{flex:1;min-width:0;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:9px 12px}
.add input:focus,.rv-add input:focus{border-style:solid;border-color:var(--ink);background:var(--surface);outline:none}
.add select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 6px;font-size:calc(13px * var(--fs,1));color:var(--muted)}
.add button,.rv-add button{border:0;background:var(--ink);color:var(--bg);border-radius:10px;width:40px;display:grid;place-items:center}
.add-warn{background:color-mix(in srgb,var(--today) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--today) 35%,transparent);border-radius:10px;padding:10px 12px;font-size:calc(14px * var(--fs,1));display:flex;flex-direction:column;gap:8px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.lockb{color:var(--lock);border-color:color-mix(in srgb,var(--lock) 50%,transparent)}
.btn.lockb.solid{background:var(--lock);color:#fff;border-color:var(--lock)}
.add button{background:var(--lock);color:#fff}
.btn.danger{color:var(--today)}
.btn.small{padding:5px 10px;font-size:calc(13px * var(--fs,1))}

/* sheet */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(520px,calc(100% - 24px));max-height:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,22,.45)}
.sheet-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;align-items:center;gap:8px}
.sheet-head h3{margin:0;font-family:var(--display);font-size:calc(20px * var(--fs,1));flex:1;display:flex;align-items:center;gap:6px}
.field{display:flex;flex-direction:column;gap:6px;font-size:calc(13px * var(--fs,1));color:var(--muted);font-weight:500}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:calc(15px * var(--fs,1));color:var(--ink);resize:vertical}
.chips,.seg{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:calc(13.5px * var(--fs,1));color:var(--ink)}
.chips button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sheet-actions .lead{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.confirm{background:var(--lock-soft);border-radius:12px;padding:12px;font-size:calc(14px * var(--fs,1));display:flex;flex-direction:column;gap:10px}
.lock-note{margin:0;background:var(--lock-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:calc(14px * var(--fs,1))}
.muted{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:calc(18px * var(--fs,1))}
.stepper output{font-family:var(--display);font-size:calc(22px * var(--fs,1));font-weight:700;min-width:1.5em;text-align:center;color:var(--ink)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.set-row p{margin:2px 0 0;font-size:calc(13px * var(--fs,1));color:var(--muted)}

/* review */
.review{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.review-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.review h2{margin:0;font-family:var(--display);font-size:calc(28px * var(--fs,1));line-height:1.1;text-wrap:balance}
.review h3{margin:6px 0 0;font-size:calc(13px * var(--fs,1));letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.review p.lead{margin:0;color:var(--muted)}
.steps{display:flex;gap:6px}
.steps span{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--ink)}
.rv-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rv-item{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.rv-item.is-locked{border:1.5px solid color-mix(in srgb,var(--lock) 55%,transparent)}
.rv-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rv-choices button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 4px;font-size:calc(13px * var(--fs,1));font-weight:600}
.rv-choices button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rv-choices button.del[aria-pressed="true"]{background:var(--today);border-color:var(--today);color:#fff}
.rv-warn{font-size:calc(12.5px * var(--fs,1));color:var(--today);font-weight:600}
.rv-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding-block:12px}
.pick{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:12px;border:1.5px solid transparent;text-align:left;width:100%;box-shadow:var(--shadow)}
.pick[aria-pressed="true"]{border-color:var(--lock);background:var(--lock-soft)}
.pick .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
.pick[aria-pressed="true"] .box{background:var(--lock);border-color:var(--lock)}
.pick .box svg{width:14px;height:14px}
.pick:disabled{cursor:default}
.rv-add{display:flex;gap:6px}

/* recurring */
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rule{background:var(--surface);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);width:100%;border:0;text-align:left}
.rule .dot{margin-top:0}
.rule-body{flex:1;min-width:0}
.intro{margin:0;color:var(--muted);font-size:calc(14px * var(--fs,1));max-width:60ch}

/* history */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--display);font-size:calc(26px * var(--fs,1));font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:calc(12px * var(--fs,1));color:var(--muted);margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:420px}
.cal .h{font-size:calc(11px * var(--fs,1));color:var(--muted);text-align:center;font-weight:600}
.day{aspect-ratio:1;border:0;border-radius:8px;background:var(--surface-2);position:relative;font-size:calc(12px * var(--fs,1));font-variant-numeric:tabular-nums;color:var(--ink);padding:0;max-width:100%}
.day[data-l="1"]{background:color-mix(in srgb,var(--ok) 25%,var(--surface-2))}
.day[data-l="2"]{background:color-mix(in srgb,var(--ok) 45%,var(--surface-2))}
.day[data-l="3"]{background:color-mix(in srgb,var(--ok) 68%,var(--surface-2));color:#fff}
.day[data-l="4"]{background:var(--ok);color:#fff}
.day.future{background:transparent;color:var(--muted);opacity:.5}
.day.is-today{outline:2px solid var(--ink);outline-offset:1px}
.day[aria-pressed="true"]{outline:2px solid var(--lock);outline-offset:1px}
.day i{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%}
.day i.ok{background:var(--lock)}
.day i.miss{border:2px solid var(--today);width:8px;height:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:calc(12px * var(--fs,1));color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.detail{background:var(--surface);border-radius:12px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.detail h3,.hsec h3{margin:0;font-family:var(--display);font-size:calc(17px * var(--fs,1))}
.detail ul{margin:0;padding-left:18px}
.hsec{display:flex;flex-direction:column;gap:10px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:calc(14px * var(--fs,1));opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:600px){ input,select,textarea{font-size:calc(16px * var(--fs,1))!important} }
@media (max-width:420px){ h1{font-size:calc(26px * var(--fs,1))} .stats .v{font-size:calc(22px * var(--fs,1))} .rv-choices button{font-size:calc(12px * var(--fs,1))} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 3px var(--surface);padding:0}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.ap-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.ap-row .progress-field{flex:1;min-width:180px;max-width:280px}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="datebar">
      <div><p class="eyebrow" id="dow"></p><h1 id="dateTitle"></h1></div>
      <div class="top-actions">
        <button class="sync" id="sync" data-s="local" type="button">Bu cihaz</button>
        <button class="icon-btn" id="settingsBtn" aria-label="Ayarlar"></button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">Bugün</button>
      <button role="tab" data-tab="projects" aria-selected="false">Projeler</button>
      <button role="tab" data-tab="recurring" aria-selected="false">Tekrarlar</button>
      <button role="tab" data-tab="history" aria-selected="false">Rapor</button>
    </nav>
  </header>

  <main>
    <section class="view" id="view-today">
      <div id="banner" hidden></div>
      <p class="summary" id="summary"></p>

      <section class="sec" data-sec="today">
        <div class="sec-head"><span class="dot"></span><h2>Bugün mutlaka</h2><span class="count" id="count-today"></span></div>
        <ul class="tasks" data-section="today" id="list-today"></ul>
                <form class="add" data-section="today"><input id="add-today" placeholder="Bugün mutlaka yapılacak…" maxlength="200" autocomplete="off"><select id="est-today" class="est-ui" aria-label="Süre"></select><button aria-label="Ekle"></button></form>
        <ul class="done-list" id="done-today"></ul>
      </section>

      <section class="sec" data-sec="week">
        <div class="sec-head"><span class="dot"></span><h2>Bu hafta</h2><span class="count" id="count-week"></span></div>
        <ul class="tasks" data-section="week" id="list-week"></ul>
        <form class="add" data-section="week"><input id="add-week" placeholder="Bu hafta içinde…" maxlength="200" autocomplete="off"><select id="est-week" class="est-ui" aria-label="Süre"></select><button aria-label="Ekle"></button></form>
        <ul class="done-list" id="done-week"></ul>
      </section>

      <section class="sec" data-sec="someday">
        <div class="sec-head"><span class="dot"></span><h2>Bir gün</h2><span class="count" id="count-someday"></span></div>
        <div id="somedayBody" class="sec">
          <ul class="tasks" data-section="someday" id="list-someday"></ul>
          <form class="add" data-section="someday"><input id="add-someday" placeholder="Fikir, acelesi olmayan iş…" maxlength="200" autocomplete="off"><select id="est-someday" class="est-ui" aria-label="Süre"></select><button aria-label="Ekle"></button></form>
          <ul class="done-list" id="done-someday"></ul>
        </div>
      </section>
    </section>

    <section class="view" id="view-projects" hidden></section>
    <section class="view" id="view-recurring" hidden></section>
    <section class="view" id="view-history" hidden></section>
  </main>
</div>

<div class="review" id="review" hidden></div>
<dialog id="sheet"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  lock: SVG('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  grip: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  check: SVG('<polyline points="5 12 10 17 19 7"/>'),
  plus: SVG('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  gear: SVG('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  repeat: SVG('<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>'),
  pin: SVG('<line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.8a2 2 0 0 0-1.1-1.8l-1.8-.9A2 2 0 0 1 15 10.8V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.8a2 2 0 0 1-1.1 1.7l-1.8.9A2 2 0 0 0 5 15.2z"/>'),
  clock: SVG('<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>'),
  list: SVG('<line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><polyline points="3 6 4.5 7.5 7 5"/><polyline points="3 12 4.5 13.5 7 11"/><polyline points="3 18 4.5 19.5 7 17"/>'),
  x: SVG('<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>'),
};
const SECTIONS = { today: 'Bugün mutlaka', week: 'Bu hafta', someday: 'Bir gün' };
const EST = [[0,'Yok'],[15,'15 dk'],[30,'30 dk'],[45,'45 dk'],[60,'1 sa'],[90,'1,5 sa'],[120,'2 sa'],[180,'3 sa'],[240,'4 sa'],[300,'5 sa'],[360,'6 sa'],[420,'7 sa'],[480,'8 sa'],[540,'9 sa'],[600,'10 sa']];
const PCOLORS = ['#D97757','#3B6FD8','#3C8B5E','#7A56C9','#C8457A','#BF8B2E','#2F8F9D','#6B6A64'];
const DOW_SHORT = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const LS_LOCAL = 'bugun-mutlaka-local-v1', LS_UI = 'bugun-mutlaka-ui-v1';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const dow = k => (parseKey(k).getDay()+6) % 7;
const mondayOf = k => addDays(k, -dow(k));
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const fmtLong = k => parseKey(k).toLocaleDateString('tr-TR', { day:'numeric', month:'long' });
const fmtDow = k => parseKey(k).toLocaleDateString('tr-TR', { weekday:'long' });
const fmtMin = m => { if (!m) return ''; const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h} sa ${r} dk` : `${h} sa`) : `${r} dk`; };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const byOrder = (a, b) => (a.order||0) - (b.order||0);

let ui = { tab:'today', somedayOpen:false, selDay:null };
try { Object.assign(ui, JSON.parse(localStorage.getItem(LS_UI) || '{}')); } catch {}
const saveUi = () => { try { localStorage.setItem(LS_UI, JSON.stringify(ui)); } catch {} };
const ACCENTS = { clay: ['#D97757', '#E08A6A', 'Turuncu'], blue: ['#3B6FD8', '#7C9BF0', 'Mavi'], green: ['#3C8B5E', '#6FC08F', 'Yeşil'],
  purple: ['#7A56C9', '#A98BEA', 'Mor'], rose: ['#C8457A', '#EB7FA8', 'Pembe'], ink: ['#44433E', '#CFCDC4', 'Koyu gri'] };
const DENSITY = { compact: [5, 3, 16], normal: [10, 6, 22], relaxed: [15, 10, 28] };
function applyAppearance() {
  const root = document.documentElement, st = root.style;
  st.setProperty('--fs', String(ui.fs || 1));
  const d = DENSITY[ui.density] || DENSITY.normal;
  st.setProperty('--row-pad', d[0] + 'px'); st.setProperty('--row-gap', d[1] + 'px'); st.setProperty('--sec-gap', d[2] + 'px');
  const a = ACCENTS[ui.accent] || ACCENTS.clay;
  st.setProperty('--accent-l', a[0]); st.setProperty('--accent-d', a[1]);
  if (ui.headFont === 'sans') st.setProperty('--display', 'var(--body)'); else st.removeProperty('--display');
  if (ui.theme === 'light' || ui.theme === 'dark') root.dataset.theme = ui.theme; else delete root.dataset.theme;
  root.classList.toggle('no-est', ui.showEst === false);
}
applyAppearance();

/* ---------- store & backends ---------- */
const store = { tasks:new Map(), recurring:new Map(), days:new Map(), projects:new Map(), groups:new Map(), meta:null };
const loaded = new Set();
let backend = null, ready = false, currentDay = today();

const LS_DATA = 'bugun-mutlaka-data-v1', LS_SYNC = 'bugun-mutlaka-sync-v1';
const local = (() => {
  let st = { docs: {}, dead: {} };
  try { const raw = JSON.parse(localStorage.getItem(LS_DATA) || 'null'); if (raw && raw.docs) st = { docs: raw.docs, dead: raw.dead || {} }; } catch {}
  let cb = null;
  const persist = () => { try { localStorage.setItem(LS_DATA, JSON.stringify(st)); } catch { toast('Cihaz depolaması yazılamadı. Hemen yedek al.'); } };
  const emit = () => {
    if (!cb) return;
    for (const c of ['tasks','recurring','days','projects','groups'])
      cb(c, Object.entries(st.docs).filter(([k]) => k.startsWith(c + '/')).map(([k, v]) => [k.slice(c.length + 1), v]));
    cb('meta', st.docs['meta/state'] || null);
  };
  return {
    kind: 'local',
    start(c) { cb = c; emit(); },
    async set(p, d) { const doc = JSON.parse(JSON.stringify(d)); doc._u = Date.now(); st.docs[p] = doc; delete st.dead[p]; persist(); sync.soon(); },
    async del(p) { delete st.docs[p]; st.dead[p] = Date.now(); persist(); sync.soon(); },
    snapshot: () => st,
    replace(next) { st = next; persist(); emit(); },
  };
})();

function mergeState(a, b) {
  const docs = {}, dead = {}, cutoff = Date.now() - 90 * 864e5;
  const keys = new Set([...Object.keys(a.docs), ...Object.keys(b.docs), ...Object.keys(a.dead), ...Object.keys(b.dead)]);
  for (const k of keys) {
    const da = a.docs[k], db = b.docs[k];
    const doc = !da ? db : !db ? da : ((db._u || 0) > (da._u || 0) ? db : da);
    const t = Math.max(a.dead[k] || 0, b.dead[k] || 0);
    if (t && (!doc || t >= (doc._u || 0))) { if (t > cutoff) dead[k] = t; }
    else if (doc) docs[k] = doc;
  }
  return { docs, dead };
}
const fingerprint = st => JSON.stringify([Object.keys(st.docs).sort().map(k => [k, st.docs[k]._u || 0]), Object.keys(st.dead).sort()]);

const sync = (() => {
  const S = { clientId: '', token: '', exp: 0, fileId: '', lastOk: 0, busy: false, again: false, timer: null, status: 'local' };
  try { Object.assign(S, JSON.parse(localStorage.getItem(LS_SYNC) || '{}')); } catch {}
  const save = () => { try { localStorage.setItem(LS_SYNC, JSON.stringify({ clientId: S.clientId, token: S.token, exp: S.exp, fileId: S.fileId, lastOk: S.lastOk, snapWeek: S.snapWeek })); } catch {} };
  const setStatus = st => { S.status = st; setSync(st); if (sheetState?.kind === 'settings') drawDrive(); };
  const tokenOk = () => S.token && Date.now() < S.exp - 60000;
  const LS_STATE = 'bugun-mutlaka-oauth-state';
  const redirectUri = () => { let p = location.pathname.replace(/index\.html$/, ''); if (!p.endsWith('/')) p += '/'; return location.origin + p; };
  // Google girişi: açılır pencere yerine aynı sayfada Google'a gidip geri döner (telefonda ve ana ekran uygulamasında güvenilir).
  function startAuth() {
    const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
    try { localStorage.setItem(LS_STATE, state); } catch {}
    const u = new URL('https://accounts.google.com/o/oauth2/v2/auth');
    u.search = new URLSearchParams({ client_id: S.clientId, redirect_uri: redirectUri(), response_type: 'token',
      scope: 'https://www.googleapis.com/auth/drive.appdata', include_granted_scopes: 'true', state }).toString();
    location.assign(u.toString());
  }
  // Dönüşte adres çubuğundaki #access_token=... bilgisini alır.
  function handleReturn() {
    const h = location.hash.slice(1); if (!h) return null;
    const q = new URLSearchParams(h);
    let msg = null;
    if (q.get('cid')) {
      const cid = q.get('cid').trim();
      if (/^[\w-]+\.apps\.googleusercontent\.com$/.test(cid) && cid !== S.clientId) { S.clientId = cid; S.token = ''; S.exp = 0; S.fileId = ''; save(); }
      msg = 'cid';
    } else if (q.get('access_token') || q.get('error')) {

function saveTaskFields(x) {
  const title = $('#f-title', sheet).value.trim() || x.title;
  const next = { ...x, title, note: $('#f-note', sheet).value.trim(), est: sheetState.est, subs: cleanSubs(), prog: sheetState.prog, groupId: $('#f-grp', sheet) ? sheetState.groupId : (x.groupId || null) };
  const fp = $('#f-proj', sheet);
  if (fp && x.section === 'project' && fp.value !== x.projectId) Object.assign(next, { projectId: fp.value, order: endOrder('project') });
  if (x.section !== 'project' && sheetState.section !== x.section) {
    const t = today();
    Object.assign(next, { section: sheetState.section, order: endOrder(sheetState.section), day: sheetState.section === 'today' ? t : x.day, weekOf: sheetState.section === 'week' ? mondayOf(t) : x.weekOf });
  }
  put('tasks', x.id, next);
  recordProgress(x, next);
  if (!next.done && !(next.subs || []).length && next.prog >= 100) { toggleDone(store.tasks.get(x.id)); toast('%100 oldu, görev tamamlandı.'); }
}

  const last = S.lastOk ? new Date(S.lastOk).toLocaleString('tr-TR', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' }) : 'henüz yok';
  box.innerHTML = `<h4>Google Drive ile eşitleme</h4>

    <div class="row-btns"><button type="button" class="btn primary" id="drvNow">Şimdi eşitle</button><button type="button" class="btn" id="drvLink">Diğer cihaz için link</button><button type="button" class="btn" id="drvSnaps">Haftalık yedekler</button><button type="button" class="btn danger" id="drvOff">Bağlantıyı kaldır</button></div>

  $('#drvSnaps', box).onclick = async () => {

    sb.innerHTML = '<p>Yükleniyor…</p>';
    try {
      const fs = await sync.listSnapshots();
      sb.innerHTML = fs.length ? `<p>Drive'da her hafta otomatik alınan yedekler (son 8 hafta). Birini seçersen önce ne içerdiğini gösterir, onaylarsan geri yükler.</p><div class="row-btns">${fs.map(f => `<button type="button" class="btn small" data-snap="${f.id}">${new Date(f.createdTime).toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' })}</button>`).join('')}</div>`

      sb.querySelectorAll('[data-snap]').forEach(b => b.onclick = async () => { try { askRestore(await sync.readSnapshot(b.dataset.snap)); } catch { toast('Yedek okunamadı.'); } });

  $('#drvNow', box).onclick = () => sync.run(true);
  $('#drvOff', box).onclick = e => {
    if (e.target.dataset.armed) { sync.disconnect(); drawDrive(); toast('Drive bağlantısı kaldırıldı. Veriler bu cihazda duruyor.'); return; }
    e.target.dataset.armed = '1'; e.target.textContent = 'Kaldırmak için tekrar dokun';
  };
}

/* ---------- backup ---------- */
let askRestore = () => {};
function buildBackup() {
  const st = local.snapshot();
  const arr = c => Object.entries(st.docs).filter(([k]) => k.startsWith(c + '/')).map(([k, v]) => ({ ...v, id: k.slice(c.length + 1) }));
  return JSON.stringify({ app: 'bugun-mutlaka', version: 1, exportedAt: new Date().toISOString(),
    meta: st.docs['meta/state'] || null, tasks: arr('tasks'), recurring: arr('recurring'), days: arr('days'), projects: arr('projects'), groups: arr('groups') }, null, 1);
}
function wireBackup() {
  const json = () => buildBackup();
  const mark = () => { putMeta({ lastBackup: today() }); };
  $('#bkSave', sheet).onclick = async () => {
    const name = `bugun-mutlaka-yedek-${today()}.json`;
    const file = new File([json()], name, { type: 'application/json' });
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (mobile && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); mark(); toast('Yedek paylaşıldı. Drive ya da Dosyalar\'a kaydedebilirsin.'); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(file), a = document.createElement('a');
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    mark(); toast('Yedek indirildi.');
  };
  $('#bkCopy', sheet).onclick = () => {
    const text = json();
    const ok = () => { mark(); toast('Yedek panoya kopyalandı. Bir nota ya da dosyaya yapıştırıp sakla.'); };
    try { navigator.clipboard.writeText(text).then(ok, () => toast('Kopyalanamadı. "Yedeği indir"i dene.')); }
    catch { toast('Kopyalanamadı. "Yedeği indir"i dene.'); }
  };
  askRestore = text => {
    let d;
    try { d = JSON.parse(String(text).trim()); } catch { toast('Yedek okunamadı. Metnin tamamını kopyaladığından emin ol.'); return; }
    if (!d || d.app !== 'bugun-mutlaka' || !Array.isArray(d.tasks)) { toast('Bu bir Bugün Mutlaka yedeği değil.'); return; }
    const box = $('#bkConfirm', sheet); box.hidden = false;
    const when = d.exportedAt ? fmtLong(keyOf(new Date(d.exportedAt))) + ' tarihli yedek' : 'Yedek';
    box.innerHTML = `<span><b>${when}:</b> ${d.tasks.length} görev, ${(d.recurring || []).length} tekrar, ${(d.days || []).length} günlük geçmiş. Şu anki verilerin <b>bu yedekle değiştirilecek</b>.</span>
      <div class="row-btns"><button type="button" class="btn primary" id="bkYes">Geri yükle</button><button type="button" class="btn" id="bkNo">Vazgeç</button></div>`;
    $('#bkNo', sheet).onclick = () => { box.hidden = true; $('#bkFile', sheet).value = ''; };
    $('#bkYes', sheet).onclick = () => { restoreBackup(d); box.hidden = true; sheet.close(); };
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast('Yedek okundu. Aşağıdaki "Geri yükle" ile onayla.');
  };
  $('#bkFile', sheet).onchange = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => askRestore(r.result);
    r.onerror = () => toast('Dosya açılamadı. "Yapıştırarak geri yükle"yi dene.');
    r.readAsText(f);
  };
  $('#bkPasteBtn', sheet).onclick = () => { const b = $('#bkPasteBox', sheet); b.hidden = !b.hidden; if (!b.hidden) $('#bkPaste', sheet).focus(); };
  $('#bkPasteGo', sheet).onclick = () => { const v = $('#bkPaste', sheet).value; if (!v.trim()) { toast('Önce yedek metnini yapıştır.'); return; } askRestore(v); };
}
function restoreBackup(d) {
  const idsOf = arr => new Set((arr || []).map(x => x.id).filter(Boolean));
  for (const coll of ['tasks', 'recurring', 'days', 'projects', 'groups']) {
    if (!Array.isArray(d[coll])) continue;
    const keep = idsOf(d[coll]);
    for (const id of [...store[coll].keys()]) if (!keep.has(id)) remove(coll, id);
    for (const x of d[coll] || []) if (x && x.id) put(coll, x.id, x);
  }
  if (d.meta) putMeta({ ...d.meta, lastReview: today() });
  toast('Yedek geri yüklendi.');
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.closest('#review') || b.closest('dialog')) return;
  const x = b.dataset.id ? store.tasks.get(b.dataset.id) : null;
  switch (b.dataset.act) {
    case 'toggle': if (x) toggleDone(x); break;
    case 'sub': if (x) {
      const subs = (x.subs || []).map(s => s.id === b.dataset.sid ? { ...s, d: !s.d } : s);
      put('tasks', x.id, { ...x, subs });
      recordProgress(x, { ...x, subs });
      if (subs.length && subs.every(s => s.d) && !x.done) toast('Tüm alt görevler bitti. Görevi de tamamlayabilirsin.');
    } break;
    case 'edit': if (x) openTaskSheet(x.id); break;
    case 'newRule': openRuleSheet(null); break;
    case 'openSettings': openSettings(); break;
    case 'gToggle': ui.gClosed = ui.gClosed || {}; ui.gClosed[b.dataset.k] = !ui.gClosed[b.dataset.k]; saveUi(); renderToday(); break;
    case 'gAdd': { const g = store.groups.get(b.dataset.gid); const inp = $('#add-' + b.dataset.sec); if (g && inp) { inp.value = '#' + gslug(g.name) + ' '; inp.focus(); } break; }
    case 'newProject': openProjectSheet(null); break;
    case 'editProject': openProjectSheet(b.dataset.id); break;
    case 'togglePDone': ui.pDone = ui.pDone || {}; ui.pDone[b.dataset.id] = !ui.pDone[b.dataset.id]; saveUi(); renderProjects(); break;
    case 'editRule': openRuleSheet(b.dataset.id); break;
    case 'selDay': ui.selDay = b.dataset.k; saveUi(); renderHistory(); break;
    case 'repPrev': case 'repNext': { const [from] = reportRange(); const step = (ui.repMode === 'week' ? 7 : 1) * (b.dataset.act === 'repPrev' ? -1 : 1); const nd = addDays(from, step); ui.repDate = nd > today() ? today() : nd; saveUi(); renderHistory(); break; }
    case 'repShare': shareReport(); break;
    case 'repImage': shareReportImage(); break;
  }
});
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { ui.tab = b.dataset.tab; saveUi(); render(); }));
$('#settingsBtn').innerHTML = ICON.gear;
$('#settingsBtn').addEventListener('click', openSettings);
$('#sync').addEventListener('click', () => { if (sync.enabled) sync.run(true); else openSettings(); });
for (const s of ['today','week','someday']) $('#est-' + s).innerHTML = EST.map(([v, l]) => `<option value="${v}">${v ? l : 'Süre'}</option>`).join('');
function addLines(text, section) {
  const lines = String(text).split(/\r?\n/).map(l => l.replace(/^\s*([-*•]|\d+[.)]|\[ ?\])\s*/, '').trim()).filter(Boolean);
  for (const l of lines) { const tg = parseTagged(l); const id = createTask({ title: tg.title, section }); if (tg.groupId) put('tasks', id, { ...store.tasks.get(id), groupId: tg.groupId }); }
  return lines.length;
}
document.querySelectorAll('form.add').forEach(f => {
  f.querySelector('button').innerHTML = ICON.plus;
  f.querySelector('input').addEventListener('paste', e => {
    const text = (e.clipboardData || window.clipboardData)?.getData('text') || '';
    if (!/\n/.test(text.trim())) return;
    e.preventDefault();
    const n = addLines(text, f.dataset.section);
    toast(`${n} görev eklendi.`);
  });
  f.addEventListener('submit', e => {
    e.preventDefault();
    const s = f.dataset.section, inp = f.querySelector('input'), sel = f.querySelector('select');
    const title = inp.value.trim(); if (!title) return;
    const tg = parseTagged(title), est = Number(sel.value) || 0;
    inp.value = ''; sel.value = '0';
    const id = createTask({ title: tg.title, est, section: s });
    if (tg.groupId) put('tasks', id, { ...store.tasks.get(id), groupId: tg.groupId });
  });
});

function initSortable() {
  if (!window.Sortable) return;
  document.querySelectorAll('ul.tasks[data-section]').forEach(list => {
    Sortable.create(list, {
      group: 'tasks', handle: '.grip', animation: 150, draggable: '.task',
      onStart() { dragging = true; },
      onEnd(evt) {
        dragging = false;
        const id = evt.item.dataset.id, x = store.tasks.get(id), to = evt.to.dataset.section;
        if (x) {
          const ids = [...evt.to.children].filter(li => li.classList.contains('task')).map(li => li.dataset.id);
          const i = ids.indexOf(id);
          const prev = store.tasks.get(ids[i-1]), next = store.tasks.get(ids[i+1]);
          const order = prev && next ? ((prev.order||0) + (next.order||0)) / 2 : prev ? (prev.order||0) + 1 : next ? (next.order||0) - 1 : 1;
          let head = evt.item.previousElementSibling; while (head && !head.classList.contains('ghead')) head = head.previousElementSibling;
          const gid = groupingOn() ? (head ? head.dataset.gid || null : (x.groupId || null)) : (x.groupId || null);
          if (to !== x.section || order !== x.order || gid !== (x.groupId || null)) { moveTask(x, to, order); put('tasks', id, { ...store.tasks.get(id), groupId: gid }); }
        }
        render();
      },
    });
  });
}

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }

setInterval(() => { if (today() !== currentDay) { currentDay = today(); maybeReview(); } scheduleRender(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (sync.enabled && sync.tokenOk()) sync.run(false); maybeReview(); scheduleRender(); } });
setInterval(() => { if (!document.hidden && sync.enabled && sync.tokenOk()) sync.run(false); }, 90000);
window.addEventListener('online', () => { if (sync.enabled && sync.tokenOk()) sync.run(false); });

async function boot() {
  render(); initSortable();
  backend = local;
  setSync(sync.initialStatus());
  try { navigator.storage?.persist?.(); } catch {}
  readImportHash();
  const ret = sync.handleReturn();
  setSync(sync.initialStatus());
  if (ret === 'ok') toast("Drive'a bağlandı, eşitleniyor…");
  else if (ret === 'cid') toast("Client ID alındı. Şimdi üstteki \"Drive'a bağlan\"a dokun.");
  else if (ret && ret.startsWith('error')) toast(ret === 'error:access_denied' ? 'Google girişi iptal edildi ya da izin verilmedi.' : 'Google girişi tamamlanamadı. Tekrar dene.');
  if (sync.enabled) {
    if (sync.tokenOk()) await Promise.race([sync.run(false), new Promise(r => setTimeout(r, 6000))]);
  }
  backend.start(onData);
}
boot();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
