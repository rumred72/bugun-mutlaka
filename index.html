<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bugün Mutlaka</title>
<meta name="description" content="Günlük yapılacaklar: bugün mutlaka, bu hafta, bir gün; kilitli görevler ve sabah planı.">
<meta name="theme-color" content="#FAF9F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#262624" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bugün Mutlaka">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<script src="vendor/Sortable.min.js"></script>
<style>
:root{
  --bg:#FAF9F5; --surface:#FFFFFF; --surface-2:#F0EEE6; --ink:#141413; --muted:#6B6A64; --line:#E3E0D5;
  --today:#B8452F; --week:#BF8B2E; --someday:#9C9A91; --lock:#D97757; --lock-soft:#F7E9E1; --ok:#5F8D63; --warn:#B8652F;
  --shadow:0 1px 2px rgba(60,45,30,.05),0 3px 10px rgba(60,45,30,.05);
  --display:"Source Serif 4","Tiempos Headline",Georgia,"Times New Roman",serif;
  --body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#262624; --surface:#30302E; --surface-2:#3A3A37; --ink:#F5F4EE; --muted:#A6A49B; --line:#45443F;
    --today:#E07A62; --week:#D9A955; --someday:#8F8D85; --lock:#E08A6A; --lock-soft:#3D2F29; --ok:#86B58A; --warn:#E39A62;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.18);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#262624; --surface:#30302E; --surface-2:#3A3A37; --ink:#F5F4EE; --muted:#A6A49B; --line:#45443F;
  --today:#E07A62; --week:#D9A955; --someday:#8F8D85; --lock:#E08A6A; --lock-soft:#3D2F29; --ok:#86B58A; --warn:#E39A62;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-inline:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--lock);outline-offset:2px}
svg{width:18px;height:18px;flex:none}
.app{max-width:640px;margin:0 auto;padding-block:8px 80px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0;margin-inline:-16px;padding-inline:16px}
.datebar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:2px 0 0;font-family:var(--display);font-size:32px;line-height:1.1;font-weight:600;letter-spacing:-.01em}
.top-actions{display:flex;align-items:center;gap:6px}
.sync{border:0;background:none;padding:6px 4px;border-radius:8px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--someday)}
.sync[data-s="ok"]::before{background:var(--ok)}
.sync[data-s="syncing"]::before{background:var(--week)}
.sync[data-s="needauth"]{color:var(--lock);font-weight:600}
.sync[data-s="needauth"]::before{background:var(--lock)}
.sync[data-s="error"]::before{background:var(--today)}
.sync[data-s="offline"]::before{background:var(--someday)}
.drive input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--ink);width:100%}
.icon-btn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:inline-grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.tabs{display:flex;gap:4px;margin-top:12px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

.view{display:flex;flex-direction:column;gap:22px;padding-top:16px}
.summary{margin:0;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.summary b{color:var(--ink);font-weight:600}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);color:var(--ink);padding:10px 12px;border-radius:10px;font-size:14px}

/* locked */
.locked{background:var(--lock-soft);border:1.5px solid color-mix(in srgb,var(--lock) 55%,transparent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.locked-head{display:flex;align-items:center;gap:8px;color:var(--lock);flex-wrap:wrap}
.locked-head h2{margin:0;font-family:var(--display);font-size:18px;font-weight:700}
.locked-head .quota{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.lcard{background:var(--surface);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:flex-start;box-shadow:var(--shadow)}
.lcard .title{font-size:17px;font-weight:600}
.lcard.done .title{text-decoration:line-through;color:var(--muted)}
.lage{font-size:12.5px;color:var(--today);font-weight:600}
.lock-empty{margin:0;font-size:14px;color:var(--muted)}

/* sections */
.sec{display:flex;flex-direction:column;gap:8px}
.sec-head{display:flex;align-items:center;gap:8px}
.sec-head h2{margin:0;font-family:var(--display);font-size:18px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
[data-sec="today"] .dot,.dot.today{background:var(--today)}
[data-sec="week"] .dot,.dot.week{background:var(--week)}
[data-sec="someday"] .dot,.dot.someday{background:var(--someday)}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.count.over{color:var(--today);font-weight:600}
.sec-head .spacer{flex:1}
.collapse{border:0;background:none;color:var(--muted);font-size:13px;padding:4px 6px;border-radius:6px}
.collapse:hover{background:var(--surface-2)}

.tasks,.done-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.tasks{min-height:6px}
.task{background:var(--surface);border-radius:12px;display:flex;align-items:flex-start;gap:8px;padding:10px 6px 10px 4px;box-shadow:var(--shadow)}
.grip{color:var(--muted);opacity:.55;padding:3px 0 0 2px;cursor:grab;touch-action:none;display:grid}
.grip:hover{opacity:1}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:transparent;flex:none;margin-top:1px;display:grid;place-items:center;padding:0;color:#fff}
.check:hover{border-color:var(--ok)}
.check svg{width:14px;height:14px;opacity:0}
.done .check,.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.done .check svg,.check[aria-pressed="true"] svg{opacity:1}
.lcard .check{width:26px;height:26px;border-color:var(--lock)}
.task-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;border:0;background:none;text-align:left;padding:0}
.title{font-weight:500;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:var(--muted);align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:6px;padding:1px 7px;font-variant-numeric:tabular-nums}
.chip svg{width:12px;height:12px}
.chip.warn{background:color-mix(in srgb,var(--today) 16%,transparent);color:var(--today);font-weight:600}
.note{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
.col{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.subs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.subs li{display:flex;align-items:flex-start;gap:8px;font-size:14px}
.subcheck{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);background:transparent;padding:0;display:grid;place-items:center;color:#fff;flex:none;margin-top:2px}
.subcheck:hover{border-color:var(--ok)}
.subcheck svg{width:11px;height:11px;opacity:0}
.subcheck[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.subcheck[aria-pressed="true"] svg{opacity:1}
.bar{display:block;height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;width:min(220px,100%);margin-top:3px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.chip.prog{color:var(--ok);font-weight:600;background:color-mix(in srgb,var(--ok) 14%,transparent)}
.rv-good{font-size:12.5px;color:var(--ok);font-weight:600}
.progress-field{display:flex;align-items:center;gap:12px}
.progress-field input[type=range]{flex:1;accent-color:var(--lock);padding:0;background:none;border:0}
.progress-field output{font-family:var(--display);font-size:22px;font-weight:600;min-width:3.2ch;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}
.backup{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.backup h4{margin:0;font-size:15px}
.backup p{margin:0;font-size:13px;color:var(--muted)}
.sdone{text-decoration:line-through;color:var(--muted)}
.sub-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sub-list li{display:flex;align-items:center;gap:8px}
.sub-list input,.sub-add input{flex:1;min-width:0}
.sub-add{display:flex;gap:6px}
.done-list .task{box-shadow:none;background:transparent;padding-block:4px}
.done-list .title{text-decoration:line-through;color:var(--muted)}
.sortable-ghost{opacity:.35}
.sortable-chosen{box-shadow:0 8px 24px rgba(0,0,0,.18)}
.empty{font-size:13.5px;color:var(--muted);padding:6px 4px;margin:0}

.add{display:flex;gap:6px}
.add input,.rv-add input{flex:1;min-width:0;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:9px 12px}
.add input:focus,.rv-add input:focus{border-style:solid;border-color:var(--ink);background:var(--surface);outline:none}
.add select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0 6px;font-size:13px;color:var(--muted)}
.add button,.rv-add button{border:0;background:var(--ink);color:var(--bg);border-radius:10px;width:40px;display:grid;place-items:center}
.add-warn{background:color-mix(in srgb,var(--today) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--today) 35%,transparent);border-radius:10px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:8px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:disabled{opacity:.45;cursor:not-allowed}
.btn.lockb{color:var(--lock);border-color:color-mix(in srgb,var(--lock) 50%,transparent)}
.btn.lockb.solid{background:var(--lock);color:#fff;border-color:var(--lock)}
.add button{background:var(--lock);color:#fff}
.btn.danger{color:var(--today)}
.btn.small{padding:5px 10px;font-size:13px}

/* sheet */
dialog{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--ink);width:min(520px,calc(100% - 24px));max-height:calc(100% - 32px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,14,22,.45)}
.sheet-body{padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;align-items:center;gap:8px}
.sheet-head h3{margin:0;font-family:var(--display);font-size:20px;flex:1;display:flex;align-items:center;gap:6px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:15px;color:var(--ink);resize:vertical}
.chips,.seg{display:flex;flex-wrap:wrap;gap:6px}
.chips button,.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--ink)}
.chips button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sheet-actions .lead{margin-right:auto;display:flex;gap:8px;flex-wrap:wrap}
.confirm{background:var(--lock-soft);border-radius:12px;padding:12px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.lock-note{margin:0;background:var(--lock-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:14px}
.muted{color:var(--muted)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px}
.stepper output{font-family:var(--display);font-size:22px;font-weight:700;min-width:1.5em;text-align:center;color:var(--ink)}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.set-row p{margin:2px 0 0;font-size:13px;color:var(--muted)}

/* review */
.review{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
.review-inner{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.review h2{margin:0;font-family:var(--display);font-size:28px;line-height:1.1;text-wrap:balance}
.review h3{margin:6px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.review p.lead{margin:0;color:var(--muted)}
.steps{display:flex;gap:6px}
.steps span{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps span.on{background:var(--ink)}
.rv-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rv-item{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.rv-item.is-locked{border:1.5px solid color-mix(in srgb,var(--lock) 55%,transparent)}
.rv-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rv-choices button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 4px;font-size:13px;font-weight:600}
.rv-choices button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rv-choices button.del[aria-pressed="true"]{background:var(--today);border-color:var(--today);color:#fff}
.rv-warn{font-size:12.5px;color:var(--today);font-weight:600}
.rv-foot{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);padding-block:12px}
.pick{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:12px;border:1.5px solid transparent;text-align:left;width:100%;box-shadow:var(--shadow)}
.pick[aria-pressed="true"]{border-color:var(--lock);background:var(--lock-soft)}
.pick .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;color:#fff;flex:none}
.pick[aria-pressed="true"] .box{background:var(--lock);border-color:var(--lock)}
.pick .box svg{width:14px;height:14px}
.pick:disabled{cursor:default}
.rv-add{display:flex;gap:6px}

/* recurring */
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rule{background:var(--surface);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);width:100%;border:0;text-align:left}
.rule .dot{margin-top:0}
.rule-body{flex:1;min-width:0}
.intro{margin:0;color:var(--muted);font-size:14px;max-width:60ch}

/* history */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:12px;color:var(--muted);margin-top:2px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;max-width:420px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.day{aspect-ratio:1;border:0;border-radius:8px;background:var(--surface-2);position:relative;font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink);padding:0;max-width:100%}
.day[data-l="1"]{background:color-mix(in srgb,var(--ok) 25%,var(--surface-2))}
.day[data-l="2"]{background:color-mix(in srgb,var(--ok) 45%,var(--surface-2))}
.day[data-l="3"]{background:color-mix(in srgb,var(--ok) 68%,var(--surface-2));color:#fff}
.day[data-l="4"]{background:var(--ok);color:#fff}
.day.future{background:transparent;color:var(--muted);opacity:.5}
.day.is-today{outline:2px solid var(--ink);outline-offset:1px}
.day[aria-pressed="true"]{outline:2px solid var(--lock);outline-offset:1px}
.day i{position:absolute;right:4px;top:4px;width:7px;height:7px;border-radius:50%}
.day i.ok{background:var(--lock)}
.day i.miss{border:2px solid var(--today);width:8px;height:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.detail{background:var(--surface);border-radius:12px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.detail h3,.hsec h3{margin:0;font-family:var(--display);font-size:17px}
.detail ul{margin:0;padding-left:18px}
.hsec{display:flex;flex-direction:column;gap:10px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:600px){ input,select,textarea{font-size:16px!important} }
@media (max-width:420px){ h1{font-size:26px} .stats .v{font-size:22px} .rv-choices button{font-size:12px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="datebar">
      <div><p class="eyebrow" id="dow"></p><h1 id="dateTitle"></h1></div>
      <div class="top-actions">
        <button class="sync" id="sync" data-s="local" type="button">Bu cihaz</button>
        <button class="icon-btn" id="settingsBtn" aria-label="Ayarlar"></button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="today" aria-selected="true">Bugün</button>
      <button role="tab" data-tab="recurring" aria-selected="false">Tekrarlar</button>
      <button role="tab" data-tab="history" aria-selected="false">Geçmiş</button>
    </nav>
  </header>

  <main>
    <section class="view" id="view-today">
      <div id="banner" hidden></div>
      <p class="summary" id="summary"></p>
      <section class="locked" id="lockedBox"></section>

      <section class="sec" data-sec="today">
        <div class="sec-head"><span class="dot"></span><h2>Bugün mutlaka</h2><span class="count" id="count-today"></span></div>
        <ul class="tasks" data-section="today" id="list-today"></ul>
        <div class="add-warn" id="warn-today" hidden></div>
        <form class="add" data-section="today"><input id="add-today" placeholder="Bugün mutlaka yapılacak…" maxlength="200" autocomplete="off"><select id="est-today" aria-label="Süre"></select><button aria-label="Ekle"></button></form>

<dialog id="sheet"></dialog>

<script>
(() => {
const SVG = p => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ICON = {
  lock: SVG('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  grip: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>',
  check: SVG('<polyline points="5 12 10 17 19 7"/>'),
  plus: SVG('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>'),
  gear: SVG('<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'),
  repeat: SVG('<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>'),
  clock: SVG('<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/>'),
  list: SVG('<line x1="9" y1="6" x2="20" y2="6"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="18" x2="20" y2="18"/><polyline points="3 6 4.5 7.5 7 5"/><polyline points="3 12 4.5 13.5 7 11"/><polyline points="3 18 4.5 19.5 7 17"/>'),
  x: SVG('<line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>'),
};
const SECTIONS = { today: 'Bugün mutlaka', week: 'Bu hafta', someday: 'Bir gün' };
const EST = [[0,'Yok'],[15,'15 dk'],[30,'30 dk'],[60,'1 sa'],[90,'1,5 sa'],[120,'2 sa'],[180,'3 sa']];
const DOW_SHORT = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const LS_LOCAL = 'bugun-mutlaka-local-v1', LS_UI = 'bugun-mutlaka-ui-v1';

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => keyOf(new Date());
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return keyOf(d); };
const dow = k => (parseKey(k).getDay()+6) % 7;
const mondayOf = k => addDays(k, -dow(k));
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const fmtLong = k => parseKey(k).toLocaleDateString('tr-TR', { day:'numeric', month:'long' });
const fmtDow = k => parseKey(k).toLocaleDateString('tr-TR', { weekday:'long' });
const fmtMin = m => { if (!m) return ''; const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h} sa ${r} dk` : `${h} sa`) : `${r} dk`; };
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const byOrder = (a, b) => (a.order||0) - (b.order||0);

let ui = { tab:'today', somedayOpen:false, selDay:null };
try { Object.assign(ui, JSON.parse(localStorage.getItem(LS_UI) || '{}')); } catch {}
const saveUi = () => { try { localStorage.setItem(LS_UI, JSON.stringify(ui)); } catch {} };

/* ---------- store & backends ---------- */
const store = { tasks:new Map(), recurring:new Map(), days:new Map(), meta:null };
const loaded = new Set();
let backend = null, ready = false, currentDay = today();

const LS_DATA = 'bugun-mutlaka-data-v1', LS_SYNC = 'bugun-mutlaka-sync-v1';
const local = (() => {
  let st = { docs: {}, dead: {} };
  try { const raw = JSON.parse(localStorage.getItem(LS_DATA) || 'null'); if (raw && raw.docs) st = { docs: raw.docs, dead: raw.dead || {} }; } catch {}
  let cb = null;
  const persist = () => { try { localStorage.setItem(LS_DATA, JSON.stringify(st)); } catch { toast('Cihaz depolaması yazılamadı. Hemen yedek al.'); } };
  const emit = () => {
    if (!cb) return;
    for (const c of ['tasks','recurring','days'])
      cb(c, Object.entries(st.docs).filter(([k]) => k.startsWith(c + '/')).map(([k, v]) => [k.slice(c.length + 1), v]));
    cb('meta', st.docs['meta/state'] || null);
  };
  return {
    kind: 'local',
    start(c) { cb = c; emit(); },
    async set(p, d) { const doc = JSON.parse(JSON.stringify(d)); doc._u = Date.now(); st.docs[p] = doc; delete st.dead[p]; persist(); sync.soon(); },
    async del(p) { delete st.docs[p]; st.dead[p] = Date.now(); persist(); sync.soon(); },
    snapshot: () => st,
    replace(next) { st = next; persist(); emit(); },
  };
})();

function mergeState(a, b) {
  const docs = {}, dead = {}, cutoff = Date.now() - 90 * 864e5;
  const keys = new Set([...Object.keys(a.docs), ...Object.keys(b.docs), ...Object.keys(a.dead), ...Object.keys(b.dead)]);
  for (const k of keys) {
    const da = a.docs[k], db = b.docs[k];
    const doc = !da ? db : !db ? da : ((db._u || 0) > (da._u || 0) ? db : da);
    const t = Math.max(a.dead[k] || 0, b.dead[k] || 0);
    if (t && (!doc || t >= (doc._u || 0))) { if (t > cutoff) dead[k] = t; }
    else if (doc) docs[k] = doc;
  }
  return { docs, dead };
}
const fingerprint = st => JSON.stringify([Object.keys(st.docs).sort().map(k => [k, st.docs[k]._u || 0]), Object.keys(st.dead).sort()]);

const sync = (() => {
  const S = { clientId: '', token: '', exp: 0, fileId: '', lastOk: 0, busy: false, again: false, timer: null, status: 'local' };
  try { Object.assign(S, JSON.parse(localStorage.getItem(LS_SYNC) || '{}')); } catch {}
  const save = () => { try { localStorage.setItem(LS_SYNC, JSON.stringify({ clientId: S.clientId, token: S.token, exp: S.exp, fileId: S.fileId, lastOk: S.lastOk })); } catch {} };
  const setStatus = st => { S.status = st; setSync(st); if (sheetState?.kind === 'settings') drawDrive(); };
  const tokenOk = () => S.token && Date.now() < S.exp - 60000;
  let gis = null;
  const loadGis = () => gis || (gis = new Promise((res, rej) => {
    if (window.google?.accounts?.oauth2) return res();
    const el = document.createElement('script'); el.src = 'https://accounts.google.com/gsi/client'; el.async = true;
    el.onload = () => res(); el.onerror = () => { gis = null; rej(new Error('gis')); };
    document.head.append(el);
  }));
  function requestToken() {
    return new Promise((res, rej) => {
      const tc = google.accounts.oauth2.initTokenClient({
        client_id: S.clientId, scope: 'https://www.googleapis.com/auth/drive.appdata', prompt: '',
        callback: r => { if (r.error) return rej(r); S.token = r.access_token; S.exp = Date.now() + (Number(r.expires_in) || 3600) * 1000; save(); res(); },
        error_callback: e => rej(e),
      });
      tc.requestAccessToken();
    });
  }
  async function api(url, opt = {}) {
    const r = await fetch(url, { ...opt, headers: { Authorization: 'Bearer ' + S.token, ...(opt.headers || {}) } });
    if (r.status === 401 || r.status === 403) { S.token = ''; save(); const e = new Error('auth'); e.auth = true; throw e; }
    if (!r.ok) { const e = new Error('http ' + r.status); e.status = r.status; throw e; }
    return r;
  }
  async function findFile() {
    if (S.fileId) return S.fileId;
    const q = encodeURIComponent("name='bugun-mutlaka.json'");
    const j = await (await api(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`)).json();
    S.fileId = j.files && j.files[0] ? j.files[0].id : ''; save();
    return S.fileId;
  }
  async function run(interactive) {
    if (!S.clientId) return;
    if (S.busy) { S.again = true; return; }
    if (!tokenOk()) {
      if (!interactive) { setStatus('needauth'); return; }
      try { if (!window.google?.accounts?.oauth2) await loadGis(); await requestToken(); }
      catch (e) { console.warn(e); setStatus('needauth'); toast('Google girişi tamamlanmadı. Tekrar dene.'); return; }
    }
    S.busy = true; setStatus('syncing');
    try {
      let id = await findFile(), remote = { docs: {}, dead: {} };
      if (id) {
        try { const j = await (await api(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).json(); if (j && j.docs) remote = { docs: j.docs, dead: j.dead || {} }; }
        catch (e) { if (e.status === 404) { S.fileId = ''; id = ''; } else throw e; }
      }
      const loc = local.snapshot(), merged = mergeState(loc, remote);
      if (fingerprint(merged) !== fingerprint(loc)) local.replace(merged);
      if (!id || fingerprint(merged) !== fingerprint(remote)) {
        const body = JSON.stringify({ app: 'bugun-mutlaka', v: 1, savedAt: new Date().toISOString(), ...merged });
        if (id) await api(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body });
        else {
          const bd = 'bm' + Date.now();
          const metaPart = JSON.stringify({ name: 'bugun-mutlaka.json', parents: ['appDataFolder'], mimeType: 'application/json' });
          const mp = `--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metaPart}\r\n--${bd}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${bd}--`;
          const j = await (await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': 'multipart/related; boundary=' + bd }, body: mp })).json();
          S.fileId = j.id;
        }
      }
      S.lastOk = Date.now(); save(); setStatus('ok');
    } catch (e) {
      console.warn(e);
      setStatus(e.auth ? 'needauth' : navigator.onLine === false ? 'offline' : 'error');
    } finally {
      S.busy = false;
      if (S.again) { S.again = false; setTimeout(() => run(false), 400); }
    }
  }
  return {
    S, run, tokenOk, loadGis,
    get enabled() { return !!S.clientId; },
    soon() { if (!S.clientId) return; clearTimeout(S.timer); S.timer = setTimeout(() => run(false), 2000); },
    configure(id) { S.clientId = id.trim(); S.token = ''; S.exp = 0; S.fileId = ''; save(); },
    disconnect() {
      if (S.token && window.google?.accounts?.oauth2) { try { google.accounts.oauth2.revoke(S.token, () => {}); } catch {} }
      S.clientId = ''; S.token = ''; S.exp = 0; S.fileId = ''; S.lastOk = 0; save(); setStatus('local');
    },
    initialStatus() { return !S.clientId ? 'local' : tokenOk() ? 'ok' : 'needauth'; },
  };
})();

function onData(kind, payload) {
  if (kind === 'meta') store.meta = payload;
  else store[kind] = new Map(payload.map(([id, d]) => [id, { ...d, id }]));
  loaded.add(kind);
  if (!ready && ['tasks','recurring','days','meta'].every(k => loaded.has(k))) {
    ready = true;
    if (!store.meta) putMeta({ lastReview: today(), lockLimit: 3, todayLimit: 5 });
  }
  if (ready) maybeReview();
  scheduleRender();
}

const queues = new Map();
function enqueue(path, op) {
  const prev = queues.get(path) || Promise.resolve();
  const run = async () => {
    try { await op(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 400 + Math.random()*600)); try { await op(); return; } catch {} }
      if (e && e.code === 'quota_exceeded') toast('Depolama sınırı doldu. Eski tekrarlayan görevleri silmeyi dene.');
      else toast('Kaydedilemedi. Bağlantını kontrol edip tekrar dene.');
      console.warn(e);
    }
  };
  const p = prev.then(run);
  queues.set(path, p);
  return p;
}
function put(coll, id, data) {
  const clean = { ...data }; delete clean.id;
  store[coll].set(id, { ...clean, id });
  scheduleRender();
  return enqueue(`${coll}/${id}`, () => backend.set(`${coll}/${id}`, clean));
}
function remove(coll, id) {
  store[coll].delete(id);
  scheduleRender();
  return enqueue(`${coll}/${id}`, () => backend.del(`${coll}/${id}`));
}
function putMeta(patch) {
  store.meta = { lastReview: today(), lockLimit: 3, todayLimit: 5, ...(store.meta || {}), ...patch };
  const clean = { ...store.meta };
  scheduleRender();
  return enqueue('meta/state', () => backend.set('meta/state', clean));
}
const meta = () => store.meta || { lockLimit: 3, todayLimit: 5 };
const tasksArr = () => [...store.tasks.values()];
function dayDoc(d) {
  const x = store.days.get(d);
  return x ? { date:d, done:[], lockedIds:[], lockedDoneIds:[], missed:0, ...x } : { date:d, done:[], lockedIds:[], lockedDoneIds:[], missed:0 };
}
function patchDay(d, fn) { const doc = structuredClone(dayDoc(d)); delete doc.id; fn(doc); put('days', d, doc); }

/* ---------- task operations ---------- */
function endOrder(sec) { let m = 0; for (const x of store.tasks.values()) if (x.section === sec && (x.order||0) > m) m = x.order; return m + 1; }
function createTask(p) {
  const t = today(), id = newId();
  put('tasks', id, {
    title: p.title, note: p.note || '', est: p.est || 0, section: p.section,
    order: p.order ?? endOrder(p.section), day: t, weekOf: mondayOf(t),
    locked: false, lockedOn: null, done: false, doneOn: null, doneAt: null,
    postponed: 0, created: Date.now(), recurId: p.recurId || null,
    subs: (p.subs || []).map(x => ({ id: newId(), t: x.t, d: false })),
  });
  return id;
}
function moveTask(x, section, order) {
  if (x.locked) return;
  const t = today();
  put('tasks', x.id, { ...x, section, order: order ?? endOrder(section), day: section === 'today' ? t : x.day, weekOf: section === 'week' ? mondayOf(t) : x.weekOf });
}
function toggleDone(x) {
  const t = today();
  if (!x.done) {
    put('tasks', x.id, { ...x, done: true, doneOn: t, doneAt: Date.now() });
    patchDay(t, d => {
      d.done = d.done.filter(e => e.id !== x.id);
      d.done.push({ id: x.id, t: x.title, s: x.section, l: !!x.locked, e: x.est || 0 });
      if (x.locked && !d.lockedDoneIds.includes(x.id)) d.lockedDoneIds.push(x.id);
    });
    if (x.locked) {
      const open = tasksArr().filter(y => y.locked && !y.done && y.id !== x.id).length;
      toast(open ? 'Kilitli görev bitti.' : 'Bugünün kilitli görevlerinin hepsi bitti.');
    }
  } else {
    const on = x.doneOn || t;
    put('tasks', x.id, { ...x, done: false, doneOn: null, doneAt: null });
    patchDay(on, d => { d.done = d.done.filter(e => e.id !== x.id); d.lockedDoneIds = d.lockedDoneIds.filter(i => i !== x.id); });
  }
}
function lockTask(x) {
  const t = today(), lim = meta().lockLimit || 3, used = dayDoc(t).lockedIds.length;
  if (used >= lim) { toast(`Bugün en fazla ${lim} görev kilitleyebilirsin. Sınırı ayarlardan değiştirebilirsin.`); return false; }
  put('tasks', x.id, { ...x, section: 'today', day: t, locked: true, lockedOn: x.lockedOn || t, order: x.section === 'today' ? x.order : endOrder('today') });
  patchDay(t, d => { if (!d.lockedIds.includes(x.id)) d.lockedIds.push(x.id); });
  return true;
}
const effProg = x => { const n = (x.subs || []).length; return n ? Math.round(100 * x.subs.filter(s => s.d).length / n) : (x.prog || 0); };
const remainEst = x => Math.round((x.est || 0) * (1 - effProg(x) / 100));
function recordProgress(before, after) {
  const a = effProg(before), b = effProg(after);
  if (a === b || after.done) return;
  patchDay(today(), d => {
    d.prog = d.prog || [];
    const e = d.prog.find(p => p.id === after.id);
    if (e) { e.b = b; e.t = after.title; if (e.a === e.b) d.prog = d.prog.filter(p => p !== e); }
    else d.prog.push({ id: after.id, t: after.title, a, b });
  });
}
const activeToday = () => tasksArr().filter(x => x.section === 'today' && !x.done).length;

/* ---------- recurring ---------- */
function ruleMatches(r, k) {
  const d = dow(k);
  if (r.type === 'daily') return true;
  if (r.type === 'weekdays') return d < 5;
  if (r.type === 'days') return (r.days || []).includes(d);
  if (r.type === 'monthly') { const dt = parseKey(k); const last = new Date(dt.getFullYear(), dt.getMonth()+1, 0).getDate(); return dt.getDate() === Math.min(r.dom || 1, last); }
  return false;
}
function ruleText(r) {
  if (r.type === 'daily') return 'Her gün';
  if (r.type === 'weekdays') return 'Hafta içi her gün';
  if (r.type === 'days') return (r.days || []).slice().sort().map(i => DOW_SHORT[i]).join(', ') || 'Gün seçilmedi';
  if (r.type === 'monthly') return `Her ayın ${r.dom}. günü`;
  return '';
}
function generateFor(r, t) {
  if (r.lastGen === t || !ruleMatches(r, t)) return;
  for (const x of tasksArr()) if (x.recurId === r.id && !x.done && !x.locked) remove('tasks', x.id);
  createTask({ title: r.title, note: r.note, est: r.est, section: r.section, recurId: r.id, subs: r.subs, order: r.section === 'today' ? 0.5 - Math.random()*0.01 : undefined });
  const rr = { ...r }; rr.lastGen = t;
  put('recurring', r.id, rr);
}

/* ---------- morning review ---------- */
let review = null, reviewedDay = null;
function maybeReview() {
  const t = today();
  if (t !== currentDay) currentDay = t;
  if (!ready || review || !store.meta || reviewedDay === t) return;
  if ((store.meta.lastReview || t) < t) startReview(t);
}
function startReview(t) {
  const thisMon = mondayOf(t);
  const missedBy = {};
  for (const x of tasksArr()) if (!x.done && x.section === 'today' && (x.day || t) < t) missedBy[x.day] = (missedBy[x.day] || 0) + 1;
  for (const [d, n] of Object.entries(missedBy)) { const doc = dayDoc(d); if (doc.missed !== n) patchDay(d, dd => { dd.missed = n; }); }
  for (const x of tasksArr()) if (x.done && (x.doneOn || t) < t) remove('tasks', x.id);
  for (const r of store.recurring.values()) generateFor(r, t);

  const rank = x => (x.locked ? 0 : x.section === 'today' ? 1 : 2);
  const items = tasksArr()
    .filter(x => !x.done && ((x.section === 'today' && (x.day || t) < t) || (x.section === 'week' && (x.weekOf || thisMon) < thisMon)))
    .sort((a, b) => rank(a) - rank(b) || byOrder(a, b))
    .map(x => ({ id: x.id, choice: x.locked ? 'today' : null }));
  review = { date: t, step: items.length ? 1 : 2, items, picks: new Set() };
  renderReview();
}
function applyReviewStep1() {
  const t = review.date, thisMon = mondayOf(t);
  for (const it of review.items) {
    const x = store.tasks.get(it.id); if (!x) continue;
    const cur = effProg(x), worked = cur > (x.progBase || 0);
    const p = (x.postponed || 0) + (worked ? 0 : 1), base = { postponed: p, progBase: cur };
    if (it.choice === 'delete') { remove('tasks', x.id); continue; }
    if (it.choice === 'today') put('tasks', x.id, { ...x, ...base, section: 'today', day: t });

/* ---------- backup ---------- */
function buildBackup() {
  const strip = m => [...m.values()].map(x => { const c = { ...x }; return c; });
  return JSON.stringify({ app: 'bugun-mutlaka', version: 1, exportedAt: new Date().toISOString(),
    meta: store.meta, tasks: strip(store.tasks), recurring: strip(store.recurring), days: strip(store.days) }, null, 1);
}
function wireBackup() {
  const json = () => buildBackup();
  const mark = () => { putMeta({ lastBackup: today() }); };
  $('#bkSave', sheet).onclick = async () => {
    const name = `bugun-mutlaka-yedek-${today()}.json`;
    const file = new File([json()], name, { type: 'application/json' });
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (mobile && navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); mark(); toast('Yedek paylaşıldı. Drive ya da Dosyalar\'a kaydedebilirsin.'); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const url = URL.createObjectURL(file), a = document.createElement('a');
    a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    mark(); toast('Yedek indirildi.');
  };
  $('#bkCopy', sheet).onclick = () => {
    const text = json();
    const ok = () => { mark(); toast('Yedek panoya kopyalandı. Bir nota ya da dosyaya yapıştırıp sakla.'); };
    try { navigator.clipboard.writeText(text).then(ok, () => toast('Kopyalanamadı. "Yedeği indir"i dene.')); }
    catch { toast('Kopyalanamadı. "Yedeği indir"i dene.'); }
  };
  const askRestore = text => {
    let d;
    try { d = JSON.parse(String(text).trim()); } catch { toast('Yedek okunamadı. Metnin tamamını kopyaladığından emin ol.'); return; }
    if (!d || d.app !== 'bugun-mutlaka' || !Array.isArray(d.tasks)) { toast('Bu bir Bugün Mutlaka yedeği değil.'); return; }
    const box = $('#bkConfirm', sheet); box.hidden = false;
    const when = d.exportedAt ? fmtLong(keyOf(new Date(d.exportedAt))) + ' tarihli yedek' : 'Yedek';
    box.innerHTML = `<span><b>${when}:</b> ${d.tasks.length} görev, ${(d.recurring || []).length} tekrar, ${(d.days || []).length} günlük geçmiş. Şu anki verilerin <b>bu yedekle değiştirilecek</b>.</span>
      <div class="row-btns"><button type="button" class="btn primary" id="bkYes">Geri yükle</button><button type="button" class="btn" id="bkNo">Vazgeç</button></div>`;
    $('#bkNo', sheet).onclick = () => { box.hidden = true; $('#bkFile', sheet).value = ''; };
    $('#bkYes', sheet).onclick = () => { restoreBackup(d); box.hidden = true; sheet.close(); };
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    toast('Yedek okundu. Aşağıdaki "Geri yükle" ile onayla.');
  };
  $('#bkFile', sheet).onchange = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => askRestore(r.result);
    r.onerror = () => toast('Dosya açılamadı. "Yapıştırarak geri yükle"yi dene.');
    r.readAsText(f);
  };
  $('#bkPasteBtn', sheet).onclick = () => { const b = $('#bkPasteBox', sheet); b.hidden = !b.hidden; if (!b.hidden) $('#bkPaste', sheet).focus(); };
  $('#bkPasteGo', sheet).onclick = () => { const v = $('#bkPaste', sheet).value; if (!v.trim()) { toast('Önce yedek metnini yapıştır.'); return; } askRestore(v); };
}
function restoreBackup(d) {
  const idsOf = arr => new Set((arr || []).map(x => x.id).filter(Boolean));
  for (const coll of ['tasks', 'recurring', 'days']) {
    const keep = idsOf(d[coll]);
    for (const id of [...store[coll].keys()]) if (!keep.has(id)) remove(coll, id);
    for (const x of d[coll] || []) if (x && x.id) put(coll, x.id, x);
  }
  if (d.meta) putMeta({ ...d.meta, lastReview: today() });
  toast('Yedek geri yüklendi.');
}

function initSortable() {
  if (!window.Sortable) return;
  document.querySelectorAll('ul.tasks[data-section]').forEach(list => {
    Sortable.create(list, {
      group: 'tasks', handle: '.grip', animation: 150, draggable: '.task',
      onStart() { dragging = true; },
      onEnd(evt) {
        dragging = false;
        const id = evt.item.dataset.id, x = store.tasks.get(id), to = evt.to.dataset.section;
        if (x) {
          const ids = [...evt.to.children].map(li => li.dataset.id);
          const i = ids.indexOf(id);
          const prev = store.tasks.get(ids[i-1]), next = store.tasks.get(ids[i+1]);
          const order = prev && next ? ((prev.order||0) + (next.order||0)) / 2 : prev ? (prev.order||0) + 1 : next ? (next.order||0) - 1 : 1;
          if (to !== x.section || order !== x.order) moveTask(x, to, order);
          if (to === 'today' && x.section !== 'today' && activeToday() > (meta().todayLimit || 5)) toast('"Bugün mutlaka" sınırı aşıldı. Bir tanesi ertelenebilir mi?');
        }
        render();
      },
    });
  });
}

let toastTimer;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2800); }

setInterval(() => { if (today() !== currentDay) { currentDay = today(); maybeReview(); } scheduleRender(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (sync.enabled && sync.tokenOk()) sync.run(false); maybeReview(); scheduleRender(); } });
setInterval(() => { if (!document.hidden && sync.enabled && sync.tokenOk()) sync.run(false); }, 90000);
window.addEventListener('online', () => { if (sync.enabled && sync.tokenOk()) sync.run(false); });

async function boot() {
  render(); initSortable();
  backend = local;
  setSync(sync.initialStatus());
  try { navigator.storage?.persist?.(); } catch {}
  if (sync.enabled) {
    sync.loadGis().catch(() => {});
    if (sync.tokenOk()) await Promise.race([sync.run(false), new Promise(r => setTimeout(r, 6000))]);
  }
  backend.start(onData);
}
boot();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
