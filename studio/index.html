<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tuciwood Stüdyo</title>
<meta name="theme-color" content="#2A2320">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Stüdyo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,400;1,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,400;1,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,800;1,400;1,600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap">
<style>
:root{
  --bg:#EFE8DF; --panel:#FFFFFF; --panel2:#F7F2EC; --ink:#2A2320; --muted:#766A62; --line:#E2D7CA;
  --accent:#A94F2E; --accent-ink:#FFFFFF; --stage:#E3D9CD; --sel:#2F6FEB;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1B1715; --panel:#262120; --panel2:#2E2826; --ink:#F1EAE2; --muted:#AFA39A; --line:#3C3431;
    --accent:#E0926F; --accent-ink:#1B1715; --stage:#121010; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 Figtree,"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:380px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100%;
  padding-top:env(safe-area-inset-top,0px)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;letter-spacing:-.01em;margin-right:6px;white-space:nowrap}
.brand span{color:var(--accent)}
.sp{flex:1}
.ib{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;height:38px;min-width:38px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap}
.ib:disabled{opacity:.4;cursor:default}
.ib.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.ib.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.ib svg{width:18px;height:18px;flex:none}

.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;border:0;background:none;padding:12px 8px;font-weight:700;font-size:13.5px;color:var(--muted);border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.panel{overflow-y:auto;padding:16px 16px 40px;flex:1;min-height:0}
.panel[hidden]{display:none}

.stage{background:var(--stage);display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;position:relative;padding:18px;overflow:hidden}
#cv{display:block;touch-action:none;box-shadow:0 12px 40px rgba(0,0,0,.18);border-radius:6px;background:#fff}
.zoomnote{position:absolute;left:14px;bottom:10px;font-size:12px;color:var(--muted)}

h3{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:22px 0 10px}
h3:first-child{margin-top:4px}
.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.f input[type=text],.f input[type=number],.f select,.f textarea{font-size:16px;color:var(--ink);background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.f textarea{min-height:76px;resize:vertical;font-size:15px;line-height:1.45}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.seg{display:flex;background:var(--panel2);border:1.5px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 8px;font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;min-width:0}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:center;font-weight:600;font-size:14px;color:var(--ink)}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.rng{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:13px;font-weight:600;color:var(--muted)}
.rng input{width:100%;accent-color:var(--accent)}
.rng output{font-variant-numeric:tabular-nums;text-align:right;color:var(--ink);font-size:12.5px}
.note{font-size:12.5px;color:var(--muted);line-height:1.45;margin:4px 0 0}
.out{font-size:13px;background:var(--panel2);border-radius:9px;padding:8px 10px;white-space:pre-line}

.tpls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{border:2px solid var(--line);border-radius:12px;background:var(--panel2);padding:6px;display:flex;flex-direction:column;gap:6px;align-items:center;font-weight:700;font-size:12.5px}
.tpl.on{border-color:var(--accent)}
.tpl canvas{width:100%;height:auto;border-radius:6px;display:block}

.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.theme{border:2px solid var(--line);border-radius:12px;background:var(--panel2);padding:8px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-weight:700;font-size:13px}
.theme.on{border-color:var(--accent)}
.theme i{display:flex;gap:3px}
.theme b{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.pairs{display:flex;flex-direction:column;gap:6px}
.pair{border:2px solid var(--line);border-radius:12px;background:var(--panel2);padding:9px 12px;text-align:left;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pair.on{border-color:var(--accent)}
.pair .s1{font-size:22px;line-height:1.1}
.pair .s2{font-size:12px;color:var(--muted)}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.colors label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.colors input{width:38px;height:32px;border:1.5px solid var(--line);border-radius:8px;padding:2px;background:var(--panel2)}

.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button.on{outline:2.5px solid var(--accent);outline-offset:2px}
.sw button.none{background:linear-gradient(135deg,transparent 45%,#c33 45%,#c33 55%,transparent 55%),var(--panel)}
.sw input[type=color]{width:34px;height:30px;border:1.5px solid var(--line);border-radius:8px;padding:2px;background:var(--panel2)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1.5px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600}
.tools{display:flex;gap:5px;flex-wrap:wrap}
.tools button{border:1.5px solid var(--line);background:var(--panel2);border-radius:9px;min-width:38px;height:36px;font-weight:700;padding:0 8px}
.tools button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.layers{display:flex;flex-direction:column;gap:4px}
.layer{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--panel2)}
.layer.on{border-color:var(--sel)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13.5px;text-align:left;border:0;background:none;padding:4px 0}
.layer .nm small{color:var(--muted);font-weight:500}
.layer button.mini{border:0;background:none;width:30px;height:30px;border-radius:7px;color:var(--muted)}
.layer.off .nm{opacity:.45}
.designs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.design{border:1.5px solid var(--line);border-radius:12px;background:var(--panel2);padding:6px;display:flex;flex-direction:column;gap:6px}
.design img{width:100%;border-radius:7px;display:block;background:var(--stage)}
.design b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.design small{color:var(--muted);font-size:11.5px}
.design .row button{flex:1}
.btn{border:1.5px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px 12px;font-weight:700;font-size:13.5px}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:#B3261E}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:18px 8px;line-height:1.5}

.menu{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.2);padding:6px;display:flex;flex-direction:column;min-width:220px}
.menu button{border:0;background:none;text-align:left;padding:10px 12px;border-radius:9px;font-weight:600;font-size:14px}
.menu button:hover{background:var(--panel2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.lbl-hide{display:none}
.lock{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.lock[hidden],.app[hidden]{display:none}
.lock form{background:var(--panel);border-radius:20px;padding:26px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.lock h1{margin:0;font-size:22px;font-weight:800}
.lock p{margin:0;color:var(--muted);line-height:1.45;font-size:14px}
.lock .err{color:#B3261E;font-weight:600;min-height:1.2em}

@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(0,1fr)}
  .stage{grid-row:2;height:50vh;height:50dvh;padding:10px}
  .side{grid-row:3;border-right:0;border-top:1px solid var(--line)}
  .top{padding:8px 10px;gap:6px}
  .brand{font-size:16px}
  .lbl{display:none}
  .zoomnote{display:none}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="lock" id="lock" hidden>
  <form id="lockForm" autocomplete="off">
    <h1>Bu uygulama özel</h1>
    <p>Tuciwood Stüdyo yalnızca erişim bağlantısıyla açılır. Size verilen bağlantıyı açın ya da bağlantıyı veya anahtarı buraya yapıştırın.</p>
    <label class="f">Erişim bağlantısı ya da anahtar<input type="text" id="lockKey" autocapitalize="off" spellcheck="false"></label>
    <button class="btn pri" type="submit">Aç</button>
    <div class="err" id="lockErr" role="alert"></div>
  </form>
</div>
<div class="app" id="appRoot" hidden>
  <div class="top">
    <div class="brand">Tuciwood <span>Stüdyo</span></div>
    <button class="ib" id="bUndo" title="Geri al (Ctrl+Z)" aria-label="Geri al"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ib" id="bRedo" title="Yinele (Ctrl+Y)" aria-label="Yinele"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="ib" id="bAdd" aria-haspopup="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">Ekle</span></button>
    <button class="ib on" id="bGuides" title="Hizalama kılavuzları ve mıknatıs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v18M3 12h18" stroke-dasharray="2 3"/><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg><span class="lbl">Kılavuz</span></button>
    <button class="ib on" id="bSafe" title="Instagram'ın kapattığı alanları göster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M6 6.5h12M6 17.5h12"/></svg><span class="lbl">Güvenli alan</span></button>
    <button class="ib" id="bMulti" title="Birden fazla öğe seç"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="11" height="11" rx="2"/><rect x="10" y="10" width="11" height="11" rx="2"/></svg><span class="lbl">Çoklu seç</span></button>
    <div class="sp"></div>
    <button class="ib" id="bShare" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg><span class="lbl">Paylaş</span></button>
    <button class="ib pri" id="bDownload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg><span>İndir</span></button>
  </div>

  <aside class="side">
    <nav class="tabs" role="tablist">
      <button data-tab="tpl" class="on">Şablon</button>
      <button data-tab="info">Bilgiler</button>
      <button data-tab="theme">Renk & Yazı</button>
      <button data-tab="el">Öğe</button>
      <button data-tab="saved">Tasarımlar</button>
    </nav>
    <div class="panel" id="p-tpl"></div>
    <div class="panel" id="p-info" hidden></div>
    <div class="panel" id="p-theme" hidden></div>
    <div class="panel" id="p-el" hidden></div>
    <div class="panel" id="p-saved" hidden></div>
  </aside>

  <main class="stage" id="stage">
    <canvas id="cv" width="1080" height="1920" aria-label="Tasarım"></canvas>
    <div class="zoomnote" id="zoomnote"></div>
  </main>
</div>
<input type="file" id="fPhoto" accept="image/*" class="hidden-file">
<div class="toast" id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
